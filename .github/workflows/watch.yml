name: camera-watch

on:
  # Główny wyzwalacz: cron-job.org co 15 min wywołuje workflow_dispatch przez API GitHuba.
  # Harmonogram GitHuba jest tylko zapasowy, bo potrafi gubić uruchomienia na wiele godzin.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write             # zapis state.json (żeby nie dublować alertów)

concurrency:
  group: camera-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sprawdź OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py
      - name: Zapisz stan
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "camera-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: nowe alerty"
            git pull --rebase -q
            git push
          fi
