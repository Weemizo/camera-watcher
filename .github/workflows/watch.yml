name: camera-watch

on:
  # Główny wyzwalacz: cron-job.org co 15 min wywołuje workflow_dispatch przez API GitHuba.
  # Harmonogram GitHuba jest tylko zapasowy, bo potrafi gubić uruchomienia na wiele godzin.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write             # zapis state.json (żeby nie dublować alertów)

concurrency:
  group: camera-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main           # najnowszy state.json, a nie ten z chwili zakolejkowania
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sprawdź OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py
      - name: Zapisz stan
        run: |
          [ -z "$(git status --porcelain state.json)" ] && exit 0
          git config user.name "camera-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/mine.json"
          # Inne uruchomienie mogło w międzyczasie zapisać swój stan: bierzemy najnowszy i dokładamy swoje alerty.
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python watcher.py --merge-state "$RUNNER_TEMP/mine.json"
            git diff --quiet state.json && exit 0
            git add state.json
            git commit -q -m "state: nowe alerty"
            git push -q && exit 0
            sleep 5
          done
          exit 1
