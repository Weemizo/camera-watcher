name: camera-watch

on:
  schedule:
    - cron: "*/15 * * * *"   # co ~15 min (GitHub potrafi opóźnić o kilka minut)
  workflow_dispatch:          # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write             # zapis state.json (żeby nie dublować alertów)

concurrency:
  group: camera-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź OLX
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py
      - name: Zapisz stan
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "camera-watch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "state: nowe alerty"
            git push
          fi
